# Alembic configuration for outo-models.
#
# Migration scripts live under `src/outo_models/db/migrations` (relative to the
# repository root, because `pyproject.toml` puts `src/` on `sys.path` via the
# editable install). The `OUTO_DB_URL` environment variable overrides the
# default SQLite URL at runtime; everything else (file paths, logging,
# script template) is hardcoded here so a fresh checkout needs no extra
# tweaking before `uv run alembic upgrade head` works.

[alembic]
# Path to migration scripts — relative to this file's directory.
script_location = src/outo_models/db/migrations

# Template used to generate migration scripts. The custom Mako template
# lives next to the `versions/` directory and imports our async-aware
# `Base.metadata` so autogenerate matches the live schema exactly.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for `create_date` / `update_date` columns in new migration
# files. The package itself uses UTC everywhere; the timestamp is recorded
# here in the same zone so audit diffs are unambiguous.
timezone = UTC

# Maximum identifier length Alembic permits in autogenerated scripts.
truncate_slug_length = 40

# `sqlalchemy.url` is set per-invocation by `env.py` from `OUTO_DB_URL`
# (falling back to `Settings.resolved_db_url`), so leave it empty here.
sqlalchemy.url =

# Tag tokens applied to every new migration by `env.py` when missing.
# `outo_version` carries the package version so future migrations can
# branch on "the deployed code is at least version X" via
# `context.get_x_argument(as_dictionary=True)`.
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S