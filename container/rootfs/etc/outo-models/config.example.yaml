# =============================================================================
# outo-models — example configuration
# =============================================================================
#
# This file is the template for /etc/outo-models/config.yaml. Copy the
# original from the container image as-is, then fill in the values. In
# production, the `outo-models setup` wizard generates this file.
#
# The top-level keys map 1:1 to the fields of outo_models.config.Settings.
# When you add a new field to Settings, update this file in lockstep — a
# static test verifies the match.
#
# Do not write secrets (secret_key, database password, etc.) directly
# here. Inject them through environment variables like OUTO_SECRET_KEY,
# or use a vault / KMS in production.

# -----------------------------------------------------------------------------
# Runtime settings
# -----------------------------------------------------------------------------

# Data directory. The DB (SQLite), git repositories, Caddy state, and
# cache all live here. Docker volumes are usually mounted at
# /var/lib/outo-models.
data_dir: /var/lib/outo-models

# Public domain the service responds on. localhost / 127.0.0.1 picks
# http automatically; everything else picks https (Settings.base_url).
domain: hub.example.com

# Database URL. Empty (null) means `${data_dir}/db.sqlite3` is chosen
# automatically.
# PostgreSQL example: postgresql+asyncpg://outo:secret@db:5432/outo
db_url: null

# Session / token signing key. In production it must be at least 32
# bytes; Settings.validate_for_production() enforces this.
# In production, inject it via the OUTO_SECRET_KEY environment variable.
secret_key: ""

# Runtime environment. Only `development` or `production` are allowed
# (Literal). Controls runtime behavior independently of the container
# image flavor (stable/dev).
env: production

# Whether new signups require admin approval. When false, signup is
# self-service.
require_approval: true

# Default storage quota granted to new users (bytes). 10 GiB =
# 10737418240.
default_quota_bytes: 10737418240

# -----------------------------------------------------------------------------
# Git LFS object storage
# -----------------------------------------------------------------------------

# LFS object backend. `local` stores objects under
# `${data_dir}/lfs/`; `s3` uses an S3-compatible endpoint (MinIO,
# AWS S3, etc.) with presigned URL upload / download.
lfs_backend: local

# Maximum size of a single LFS object (bytes). 5 GiB = 5368709120.
lfs_max_object_bytes: 5368709120

# S3 backend settings (only used when lfs_backend: s3).
# Endpoint example: https://s3.ap-northeast-2.amazonaws.com or a MinIO URL.
s3_endpoint: ""
s3_bucket: ""
s3_region: us-east-1
# Do not write access keys directly here — inject OUTO_S3_ACCESS_KEY /
# OUTO_S3_SECRET_KEY via environment variables instead.
s3_access_key: ""
s3_secret_key: ""
# Object-key prefix inside the bucket.
s3_prefix: lfs
# Presigned URL lifetime (seconds).
s3_presign_ttl_seconds: 3600

# -----------------------------------------------------------------------------
# Spaces runtime (v2)
# -----------------------------------------------------------------------------

# Whether to run Spaces as containers. Requires the Podman API socket.
spaces_runtime_enabled: false

# Podman API socket path. Inside the container, mount the host socket
# (e.g. -v /run/user/1000/podman/podman.sock:/run/podman/podman.sock).
podman_socket: /run/podman/podman.sock

# Host port range to assign to Space containers.
spaces_runtime_port_range_start: 20000
spaces_runtime_port_range_end: 21000

# -----------------------------------------------------------------------------
# DNS / TLS configuration
# -----------------------------------------------------------------------------
# Values consumed by outo_models.tls.caddy_manager.TlsConfig are
# injected through separate environment variables (OUTO_TLS_DNS_PROVIDER,
# OUTO_TLS_ACME_EMAIL, OUTO_TLS_STAGING, CLOUDFLARE_API_TOKEN) rather
# than Settings fields, so they do not appear as top-level YAML keys
# here — this comment exists for reference only.
#
# Example environment variables (do not use verbatim):
#
#   # ACME account contact — the address Let's Encrypt sends expiry
#   # warnings to
#   OUTO_TLS_ACME_EMAIL=admin@example.com
#
#   # DNS-01 challenge provider. `cloudflare` uses the
#   # caddy-dns/cloudflare plugin; empty falls back to HTTP-01.
#   OUTO_TLS_DNS_PROVIDER=cloudflare
#
#   # The Cloudflare API token is read from the Caddy process's
#   # environment ({env.CLOUDFLARE_API_TOKEN}). Never paste it directly
#   # into this file.
#   CLOUDFLARE_API_TOKEN=<your-token>
#
#   # When true, use the Let's Encrypt staging CA. Intended as a
#   # temporary flag during first setup to avoid rate-limit losses from
#   # a typo'd domain.
#   OUTO_TLS_STAGING=false
#
