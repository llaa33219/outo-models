[project]
name = "outo-models-cli"
version = "0.2.1"
description = "Command-line client for self-hosted outo-models servers — auth, repo, download, and upload."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
license-files = ["LICENSE"]
authors = [{ name = "outo-models developers" }]
keywords = ["outo-models", "model-hub", "cli", "huggingface", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[project.scripts]
omc = "outo_models_cli.main:cli"
outo-models-cli = "outo_models_cli.main:cli"

[project.urls]
Homepage = "https://github.com/outo-models/outo-models"
Documentation = "https://github.com/outo-models/outo-models/blob/main/omc/README.md"
Repository = "https://github.com/outo-models/outo-models"
Issues = "https://github.com/outo-models/outo-models/issues"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outo_models_cli"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ASYNC", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S108", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
exclude = "(tests/)"

[[tool.mypy.overrides]]
module = ["typer.*"]
ignore_missing_imports = true