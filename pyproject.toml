[project]
name = "outo-models"
version = "0.1.0"
description = "Fully open-source, self-hostable model hub (models, datasets, spaces) with automatic HTTPS, DNS and firewall setup."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
license-files = ["LICENSE"]
authors = [{ name = "outo-models developers" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "pyseto>=1.7",
    "slowapi>=0.1.9",
    "apscheduler>=3.10,<4.0",
    "dulwich>=0.22",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "questionary>=2.0",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[project.scripts]
outo-models = "outo_models.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "trustme>=1.1",
    "hypothesis>=6.103",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "types-itsdangerous>=1.1",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outo_models"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ASYNC", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
exclude = "(tests/|db/migrations/)"

[[tool.mypy.overrides]]
module = ["dulwich.*", "slowapi.*", "questionary.*", "pyseto.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
