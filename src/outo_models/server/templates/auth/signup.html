{% extends "base.html" %}
{% block title %}Sign up — outo-models{% endblock %}
{% block content %}
<h1>Create an account</h1>
<p class="muted">Enter your username, email, and password.</p>
{% if error %}<div class="errors">{{ error }}</div>{% endif %}
<form method="post" action="/signup">
  <input type="hidden" name="_csrf" value="{{ request.cookies.get('_csrf', '') }}">
  <p>
    <label>Username<br>
      <input type="text" name="username" required minlength="1" maxlength="63">
    </label>
  </p>
  <p>
    <label>Email<br>
      <input type="email" name="email" required>
    </label>
  </p>
  <p>
    <label>Password (minimum 8 characters)<br>
      <input type="password" name="password" required minlength="8">
    </label>
  </p>
  <p><button type="submit">Sign up</button></p>
</form>
<p class="muted">Already have an account? <a href="/login">Log in</a></p>
{% endblock %}
