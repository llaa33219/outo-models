{% extends "base.html" %}
{% block title %}Log in — outo-models{% endblock %}
{% block content %}
<h1>Log in</h1>
<p class="muted">Enter your username and password.</p>
{% if error %}<div class="errors">{{ error }}</div>{% endif %}
<form method="post" action="/login">
  <input type="hidden" name="_csrf" value="{{ request.cookies.get('_csrf', '') }}">
  <p>
    <label>Username<br>
      <input type="text" name="username" required>
    </label>
  </p>
  <p>
    <label>Password<br>
      <input type="password" name="password" required>
    </label>
  </p>
  <p><button type="submit">Log in</button></p>
</form>
<p class="muted">Don't have an account? <a href="/signup">Sign up</a></p>
{% endblock %}
