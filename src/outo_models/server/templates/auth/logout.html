{% extends "base.html" %}
{% block title %}Sign out &mdash; outo-models{% endblock %}
{% block content %}
<section class="logout-tile">
  <h1>Sign out of {{ current_user.username }}?</h1>
  <p class="muted">
    Your session cookie will be cleared and you will be returned to the home page.
    You can sign back in at any time.
  </p>

  <form method="post" action="/logout" class="logout-form">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <p class="form-actions">
      <a href="/" class="btn btn-cancel">Cancel</a>
      <button type="submit" class="btn btn-primary">Sign out</button>
    </p>
  </form>
</section>
{% endblock %}
