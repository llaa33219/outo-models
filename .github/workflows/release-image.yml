name: release-image

# Tag-driven multi-arch image builds. Push a tag of the form:
#   v1.2.3-stable   → IMAGE_FLAVOR=stable
#   v1.2.3-dev      → IMAGE_FLAVOR=dev
#
# Each flavor is built natively per architecture (amd64 on ubuntu-24.04,
# arm64 on ubuntu-24.04-arm — free for public repos) and combined into a
# manifest list, so `podman pull ghcr.io/<owner>/outo-models:1.2.3-stable`
# resolves to the right arch automatically.
#
# Published tags (ghcr.io/<owner>/outo-models):
#   :X.Y.Z-<flavor>          manifest list (amd64 + arm64)
#   :X.Y.Z-<flavor>-<arch>   per-arch images (debugging / pinning)
#   :<flavor>                moving manifest tag
#   :latest                  moving manifest tag, stable releases only
on:
  push:
    tags:
      - "v*-stable"
      - "v*-dev"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run pytest
      - run: bash scripts/check-docs.sh

  build-arch:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse tag
        id: tag
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-(stable|dev)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "flavor=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag '$REF' must match vX.Y.Z-stable or vX.Y.Z-dev"
            exit 1
          fi

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image (${{ matrix.arch }})
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          FLAVOR: ${{ steps.tag.outputs.flavor }}
          IMAGE: ghcr.io/${{ github.repository }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          podman build \
            --platform "linux/$ARCH" \
            --build-arg IMAGE_FLAVOR="$FLAVOR" \
            --tag "$IMAGE:$VERSION-$FLAVOR-$ARCH" \
            .

      - name: Push image (${{ matrix.arch }})
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          FLAVOR: ${{ steps.tag.outputs.flavor }}
          IMAGE: ghcr.io/${{ github.repository }}
          ARCH: ${{ matrix.arch }}
        run: podman push "$IMAGE:$VERSION-$FLAVOR-$ARCH"

      - name: Smoke check the built image (${{ matrix.arch }})
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          FLAVOR: ${{ steps.tag.outputs.flavor }}
          IMAGE: ghcr.io/${{ github.repository }}
          ARCH: ${{ matrix.arch }}
        run: podman run --rm --platform "linux/$ARCH" "$IMAGE:$VERSION-$FLAVOR-$ARCH" --help

  manifest:
    needs: build-arch
    runs-on: ubuntu-24.04
    steps:
      - name: Parse tag
        id: tag
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-(stable|dev)$ ]]
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "flavor=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Create and push manifest lists
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          FLAVOR: ${{ steps.tag.outputs.flavor }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          podman pull "$IMAGE:$VERSION-$FLAVOR-amd64"
          podman pull "$IMAGE:$VERSION-$FLAVOR-arm64"

          TAGS=("$VERSION-$FLAVOR" "$FLAVOR")
          # The moving latest tag only tracks stable releases.
          if [[ "$FLAVOR" == "stable" ]]; then
            TAGS+=("latest")
          fi

          for t in "${TAGS[@]}"; do
            podman manifest rm "$IMAGE:$t" 2>/dev/null || true
            podman manifest create "$IMAGE:$t" \
              "$IMAGE:$VERSION-$FLAVOR-amd64" \
              "$IMAGE:$VERSION-$FLAVOR-arm64"
            podman manifest push --all "$IMAGE:$t" "docker://$IMAGE:$t"
          done
